<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>MyScale</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

  <!-- ホーム -->
  <section id="homeView">

    <header>
      <div>
        <h1>MyScale</h1>
        <div class="subtitle">
          好きなものを、自分のものさしで。
        </div>
      </div>

      <button
        class="circle-add"
        onclick="openCategoryCreator()"
      >
        ＋
      </button>
    </header>

    <div
      id="categoryGrid"
      class="categories"
    ></div>

    <h2 class="section-title">
      最近の記録
    </h2>

    <div id="recentRecords"></div>

  </section>


  <!-- カテゴリー詳細 -->
  <section id="categoryView" hidden>

    <button
      class="back-button"
      onclick="showHome()"
    >
      ← ホーム
    </button>

    <header>
      <div>
        <h1 id="categoryTitle">
          カテゴリー
        </h1>

        <div class="subtitle">
          評価する対象を選ぼう
        </div>
      </div>

      <button
        class="circle-add"
        onclick="openItemCreator()"
      >
        ＋
      </button>
    </header>

    <div
      id="categoryItems"
      class="items-grid"
    ></div>

    <button
      class="danger-button"
      onclick="deleteCurrentCategory()"
    >
      このカテゴリーを削除
    </button>

  </section>


  <!-- 対象詳細 -->
  <section id="itemView" hidden>

    <button
      class="back-button"
      onclick="openCategory(currentCategoryId)"
    >
      ← カテゴリー
    </button>

    <header>
      <div>
        <h1 id="itemTitle">
          対象
        </h1>

        <div
          id="itemCategory"
          class="subtitle"
        ></div>
      </div>
      <button
  id="itemEditButton"
  class="item-edit-button"
  onclick="toggleItemEditMode()"
>
  編集
</button>
      <button
  id="itemInfoEditButton"
  class="chart-delete item-info-edit-button"
  onclick="openItemInfoEditor()"
>
  対象情報を編集
</button>
    </header>


    <div class="detail-card">

      <h2>📝 メモ</h2>
<button
  id="memoEditButton"
  class="chart-delete memo-edit-button"
  onclick="openMemoEditor()"
>
  •••
</button>
      <div
        id="itemMemoView"
        class="muted"
      ></div>

      <div
        id="itemTagsView"
        class="tags"
      ></div>

    </div>
<div class="detail-card">

  <h2>📋 基本情報</h2>

  <div id="customFieldsContainer"></div>

  <br>

  <button
    class="primary-button"
    onclick="openAddFieldMenu()"
  >
    ＋ 情報項目を追加
  </button>

</div>

    <div class="detail-card">

      <h2>🕸️ 評価チャート</h2>

      <div id="chartsContainer"></div>

      <br>

      <button
        class="primary-button"
        onclick="addChartComingSoon()"
      >
        ＋ 評価チャートを追加
      </button>

    </div>


    <button
      class="danger-button"
      onclick="deleteCurrentItem()"
    >
      この記録を削除
    </button>

  </section>

</main>


<!-- 下ナビ -->
<nav>

  <button onclick="showHome()">
    <div class="nav-icon">🏠</div>
    ホーム
  </button>

  <button onclick="showHome()">
    <div class="nav-icon">📁</div>
    カテゴリー
  </button>

  <button onclick="openCategoryCreator()">
    <div class="nav-icon">➕</div>
    追加
  </button>

  <button onclick="alert('検索はもう少し待ってね！')">
    <div class="nav-icon">🔍</div>
    検索
  </button>

  <button onclick="alert('設定もこれから作るぞ！')">
    <div class="nav-icon">⚙️</div>
    設定
  </button>

</nav>


<!-- カテゴリー作成 -->
<div
  id="categoryModal"
  class="overlay"
  onclick="closeOnBackground(event, 'categoryModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <h2>カテゴリーを作成</h2>

      <button
        class="close"
        onclick="closeCategoryCreator()"
      >
        ×
      </button>

    </div>


    <label>
      カテゴリー名
    </label>

    <input
      id="categoryName"
      class="field"
      type="text"
      maxlength="30"
      placeholder="例：アニメキャラ"
    >


    <label>
      アイコン
    </label>

    <div
      id="emojiPicker"
      class="emoji-picker"
    ></div>


    <button
      class="save-button"
      onclick="saveCategory()"
    >
      カテゴリーを保存
    </button>

  </div>

</div>


<!-- 対象作成 -->
<div
  id="itemModal"
  class="overlay"
  onclick="closeOnBackground(event, 'itemModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <h2 id="itemModalTitle">
        対象を追加
      </h2>

      <button
        class="close"
        onclick="closeItemCreator()"
      >
        ×
      </button>

    </div>


    <label>
      名前
    </label>

    <input
      id="itemName"
      class="field"
      type="text"
      maxlength="50"
      placeholder="例：綾波レイ"
    >


    <label>
      メモ
    </label>

    <textarea
      id="itemMemo"
      class="field"
      maxlength="500"
      placeholder="好きなところ、気になったことなど"
    ></textarea>


    <label>
      タグ
    </label>

    <input
      id="itemTags"
      class="field"
      type="text"
      maxlength="100"
      placeholder="例：推し 女性キャラ エヴァ"
    >

    <div class="muted">
      スペース区切りで複数登録できます
    </div>


    <button
      class="save-button"
      onclick="saveItem()"
    >
      保存
    </button>

  </div>

</div>

<!-- 評価チャート作成 -->
<div
  id="chartModal"
  class="overlay"
  onclick="closeOnBackground(event, 'chartModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <h2>評価チャートを作成</h2>

      <button
        class="close"
        onclick="closeChartCreator()"
      >
        ×
      </button>

    </div>


    <label>チャート名</label>

    <input
      id="chartName"
      class="field"
      type="text"
      maxlength="40"
      placeholder="例：キャラクター評価"
    >


    <label>満点</label>

    <select
      id="chartMax"
      class="field"
      onchange="chartMaxChanged()"
    >
      <option value="5">5点満点</option>
      <option value="10">10点満点</option>
    </select>


    <label>評価項目</label>

    <div id="axisEditor"></div>


    <button
      class="axis-add-button"
      type="button"
      onclick="addAxis()"
    >
      ＋ 評価項目を追加
    </button>


    <button
      class="save-button"
      onclick="saveChartV031()"
    >
      チャートを保存
    </button>

  </div>

</div>
<!-- チャート追加方法 -->
<div
  id="addChartModal"
  class="overlay"
  onclick="closeOnBackground(event, 'addChartModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <h2>評価チャートを追加</h2>

      <button
        class="close"
        onclick="closeAddChartMenu()"
      >
        ×
      </button>

    </div>


    <button
      class="action-card"
      onclick="createNewChartFromMenu()"
    >

      <span class="action-icon">
        ✨
      </span>

      <span>
        <strong>
          新しいチャートを作る
        </strong>

        <small>
          評価項目をゼロから作成
        </small>
      </span>

    </button>


    <button
      class="action-card"
      onclick="openTemplatePicker()"
    >

      <span class="action-icon">
        🧩
      </span>

      <span>
        <strong>
          テンプレートから作る
        </strong>

        <small>
          保存した評価軸を再利用
        </small>
      </span>

    </button>

  </div>

</div>



<!-- テンプレート選択 -->
<div
  id="templateModal"
  class="overlay"
  onclick="closeOnBackground(event, 'templateModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <h2>
        🧩 テンプレート
      </h2>

      <button
        class="close"
        onclick="closeTemplatePicker()"
      >
        ×
      </button>

    </div>


    <div id="templateList"></div>

  </div>

</div>



<!-- チャート•••メニュー -->
<div
  id="chartActionModal"
  class="overlay"
  onclick="closeOnBackground(event, 'chartActionModal')"
>

  <div class="sheet action-sheet">

    <div class="action-title">

      <small>
        評価チャート
      </small>

      <strong id="chartActionTitle">
        チャート
      </strong>

    </div>


    <button
      class="action-row"
      onclick="actionEditChart()"
    >
      ✏️
      <span>編集</span>
    </button>


    <button
      class="action-row"
      onclick="actionDuplicateChart()"
    >
      📋
      <span>この対象内で複製</span>
    </button>


    <button
      class="action-row"
      onclick="actionSaveTemplate()"
    >
      🧩
      <span>
        テンプレートとして保存
      </span>
    </button>


    <button
      class="action-row danger-row"
      onclick="actionDeleteChart()"
    >
      🗑️
      <span>削除</span>
    </button>


    <button
      class="cancel-action"
      onclick="closeChartActionMenu()"
    >
      キャンセル
    </button>

  </div>

</div>
<!-- v0.5 情報項目タイプ選択 -->
<div
  id="addFieldModal"
  class="overlay"
  onclick="closeOnBackground(event, 'addFieldModal')"
>
  <div class="sheet">

    <div class="sheet-head">
      <h2>情報項目を追加</h2>

      <button
        class="close"
        onclick="closeAddFieldMenu()"
      >
        ×
      </button>
    </div>

    <button
      class="action-card"
      onclick="chooseFieldType('text')"
    >
      <span class="action-icon">📝</span>
      <span>
        <strong>テキスト</strong>
        <small>属性、所属、好きなものなど</small>
      </span>
    </button>

    <button
      class="action-card"
      onclick="chooseFieldType('number')"
    >
      <span class="action-icon">🔢</span>
      <span>
        <strong>数値</strong>
        <small>身長、価格、話数など</small>
      </span>
    </button>

    <button
      class="action-card"
      onclick="chooseFieldType('boolean')"
    >
      <span class="action-icon">☑️</span>
      <span>
        <strong>Yes / No</strong>
        <small>推し？ 購入済み？など</small>
      </span>
    </button>

  </div>
</div>


<!-- v0.5 情報項目入力 -->
<div
  id="fieldEditorModal"
  class="overlay"
  onclick="closeOnBackground(event, 'fieldEditorModal')"
>
  <div class="sheet">

    <div class="sheet-head">
      <h2 id="fieldEditorTitle">情報項目</h2>

      <button
        class="close"
        onclick="closeFieldEditor()"
      >
        ×
      </button>
    </div>

    <label>項目名</label>

    <input
      id="fieldLabel"
      class="field"
      type="text"
      maxlength="30"
      placeholder="例：身長"
    >

    <label>内容</label>

    <input
      id="fieldValue"
      class="field"
      type="text"
      maxlength="100"
      placeholder="例：157 cm"
    >

    <div
      id="yesNoArea"
      class="yes-no-area"
      hidden
    >
      <label class="yes-no-option">
        <input
          type="radio"
          name="booleanValue"
          value="yes"
          checked
        >
        YES
      </label>

      <label class="yes-no-option">
        <input
          type="radio"
          name="booleanValue"
          value="no"
        >
        NO
      </label>
    </div>

    <button
      class="save-button"
      onclick="saveCustomField()"
    >
      保存
    </button>

  </div>
</div>
  <!-- =========================
     v0.5.2 設定・バックアップ
========================= -->

<div
  id="settingsModal"
  class="overlay"
  onclick="closeOnBackground(event, 'settingsModal')"
>
  <div class="sheet">

    <div class="sheet-head">
      <h2>⚙️ 設定</h2>

      <button
        class="close"
        onclick="closeSettings()"
      >
        ×
      </button>
    </div>

    <div class="settings-section">

      <h3>データ管理</h3>

      <button
        class="action-card"
        onclick="exportMyScaleData()"
      >
        <span class="action-icon">📤</span>

        <span>
          <strong>バックアップを書き出す</strong>
          <small>
            カテゴリー・記録・評価チャート・
            テンプレートを保存
          </small>
        </span>
      </button>

      <button
        class="action-card"
        onclick="chooseBackupFile()"
      >
        <span class="action-icon">📥</span>

        <span>
          <strong>バックアップから復元</strong>
          <small>
            保存したMyScaleデータを読み込む
          </small>
        </span>
      </button>

      <input
        id="backupFileInput"
        type="file"
        accept=".json,application/json"
        hidden
        onchange="importMyScaleData(event)"
      >

    </div>

  </div>
</div>
  <!-- =========================
     v0.6 基本情報 編集メニュー
========================= -->

<div
  id="fieldActionModal"
  class="overlay"
  onclick="closeOnBackground(event, 'fieldActionModal')"
>
  <div class="sheet">

    <div class="action-title">
      <small>基本情報</small>
      <strong id="fieldActionTitle">項目</strong>
    </div>

    <button
      class="action-row"
      onclick="actionEditCustomField()"
    >
      <span>✏️</span>
      <span>編集</span>
    </button>

    <button
      class="action-row danger-row"
      onclick="actionDeleteCustomField()"
    >
      <span>🗑️</span>
      <span>削除</span>
    </button>

    <button
      class="cancel-action"
      onclick="closeFieldActionMenu()"
    >
      キャンセル
    </button>

  </div>
</div>
 <!-- =========================
     v0.6.1 メモ・タグ編集
========================= -->

<div
  id="memoEditorModal"
  class="overlay"
  onclick="closeOnBackground(event, 'memoEditorModal')"
>
  <div class="sheet">

    <div class="sheet-head">
      <h2>📝 メモ・タグを編集</h2>

      <button
        class="close"
        onclick="closeMemoEditor()"
      >
        ×
      </button>
    </div>

    <label>メモ</label>

    <textarea
      id="memoEditValue"
      class="field"
      maxlength="500"
      placeholder="好きなところ、気になったことなど"
    ></textarea>

    <label>タグ</label>

    <input
      id="memoEditTags"
      class="field"
      type="text"
      maxlength="100"
      placeholder="例：推し 女性キャラ エヴァ"
    >

    <div class="muted">
      スペース区切りで複数登録できます
    </div>

    <button
      class="save-button"
      onclick="saveMemoEdit()"
    >
      保存
    </button>

  </div>
</div> 
  <script src="app.js?v=061"></script>

</body>
</html>
