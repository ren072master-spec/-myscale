<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyScale</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f6f7fb;
      color: #202235;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      padding: 24px 18px 100px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #777;
      margin-top: 4px;
      font-size: 14px;
    }

    .add {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: #6557d9;
      color: white;
      font-size: 28px;
    }

    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .category {
      background: white;
      border-radius: 20px;
      padding: 20px;
      min-height: 130px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .emoji {
      font-size: 34px;
    }

    .category h2 {
      margin: 14px 0 3px;
      font-size: 18px;
    }

    .count {
      color: #888;
      font-size: 13px;
    }

    .new {
      border: 2px dashed #ccc;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .recent-title {
      margin-top: 32px;
      margin-bottom: 15px;
    }

    .item {
      background: white;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 18px rgba(0,0,0,.05);
    }

    .item-name {
      font-weight: 700;
    }

    .item-info {
      color: #888;
      font-size: 13px;
      margin-top: 5px;
    }

    .score {
      font-size: 20px;
      font-weight: bold;
    }

    .star {
      color: #f4b400;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(480px, 100%);
      height: 75px;
      background: rgba(255,255,255,.95);
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    nav div {
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div>
      <h1>MyScale</h1>
      <div class="subtitle">好きなものを、自分のものさしで。</div>
    </div>

    <button class="add">＋</button>
  </header>


  <div class="categories">

    <div class="category">
      <div class="emoji">🎬</div>
      <h2>アニメ</h2>
      <div class="count">0件の記録</div>
    </div>

    <div class="category">
      <div class="emoji">🍜</div>
      <h2>ラーメン</h2>
      <div class="count">0件の記録</div>
    </div>

    <div class="category">
      <div class="emoji">🎮</div>
      <h2>ゲーム</h2>
      <div class="count">0件の記録</div>
    </div>

    <div class="category new">
      <div class="emoji">＋</div>
      <h2>カテゴリー作成</h2>
    </div>

  </div>


  <h2 class="recent-title">最近の記録</h2>

  <div class="item">
    <div>
      <div class="item-name">まだ記録がありません</div>
      <div class="item-info">＋から最初の評価を作ってみよう</div>
    </div>
  </div>

</div>


<nav>
  <div>🏠<br>ホーム</div>
  <div>📁<br>カテゴリー</div>
  <div>➕<br>追加</div>
  <div>🔍<br>検索</div>
  <div>⚙️<br>設定</div>
</nav>

</body>
</html>
