<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>MyScale</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

  <!-- ホーム -->
  <section id="homeView">

    <header>
      <div>
        <h1>MyScale</h1>
        <div class="subtitle">
          好きなものを、自分のものさしで。
        </div>
      </div>

      <button
        class="circle-add"
        onclick="openCategoryCreator()"
      >
        ＋
      </button>
    </header>

    <div
      id="categoryGrid"
      class="categories"
    ></div>

    <h2 class="section-title">
      最近の記録
    </h2>

    <div id="recentRecords"></div>

  </section>


  <!-- カテゴリー詳細 -->
  <section id="categoryView" hidden>

    <button
      class="back-button"
      onclick="showHome()"
    >
      ← ホーム
    </button>

    <header>
      <div>
        <h1 id="categoryTitle">
          カテゴリー
        </h1>

        <div class="subtitle">
          評価する対象を選ぼう
        </div>
      </div>

      <button
        class="circle-add"
        onclick="openItemCreator()"
      >
        ＋
      </button>
    </header>

    <div
      id="categoryItems"
      class="items-grid"
    ></div>

    <button
      class="danger-button"
      onclick="deleteCurrentCategory()"
    >
      このカテゴリーを削除
    </button>

  </section>


  <!-- 対象詳細 -->
  <section id="itemView" hidden>

    <button
      class="back-button"
      onclick="openCategory(currentCategoryId)"
    >
      ← カテゴリー
    </button>

    <header>
      <div>
        <h1 id="itemTitle">
          対象
        </h1>

        <div
          id="itemCategory"
          class="subtitle"
        ></div>
      </div>
    </header>


    <div class="detail-card">

      <h2>📝 メモ</h2>

      <div
        id="itemMemoView"
        class="muted"
      ></div>

      <div
        id="itemTagsView"
        class="tags"
      ></div>

    </div>


    <div class="detail-card">

      <h2>🕸️ 評価チャート</h2>

      <div id="chartsContainer"></div>

      <br>

      <button
        class="primary-button"
        onclick="addChartComingSoon()"
      >
        ＋ 評価チャートを追加
      </button>

    </div>


    <button
      class="danger-button"
      onclick="deleteCurrentItem()"
    >
      この記録を削除
    </button>

  </section>

</main>


<!-- 下ナビ -->
<nav>

  <button onclick="showHome()">
    <div class="nav-icon">🏠</div>
    ホーム
  </button>

  <button onclick="showHome()">
    <div class="nav-icon">📁</div>
    カテゴリー
  </button>

  <button onclick="openCategoryCreator()">
    <div class="nav-icon">➕</div>
    追加
  </button>

  <button onclick="alert('検索はもう少し待ってね！')">
    <div class="nav-icon">🔍</div>
    検索
  </button>

  <button onclick="alert('設定もこれから作るぞ！')">
    <div class="nav-icon">⚙️</div>
    設定
  </button>

</nav>


<!-- カテゴリー作成 -->
<div
  id="categoryModal"
  class="overlay"
  onclick="closeOnBackground(event, 'categoryModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <h2>カテゴリーを作成</h2>

      <button
        class="close"
        onclick="closeCategoryCreator()"
      >
        ×
      </button>

    </div>


    <label>
      カテゴリー名
    </label>

    <input
      id="categoryName"
      class="field"
      type="text"
      maxlength="30"
      placeholder="例：アニメキャラ"
    >


    <label>
      アイコン
    </label>

    <div
      id="emojiPicker"
      class="emoji-picker"
    ></div>


    <button
      class="save-button"
      onclick="saveCategory()"
    >
      カテゴリーを保存
    </button>

  </div>

</div>


<!-- 対象作成 -->
<div
  id="itemModal"
  class="overlay"
  onclick="closeOnBackground(event, 'itemModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <h2 id="itemModalTitle">
        対象を追加
      </h2>

      <button
        class="close"
        onclick="closeItemCreator()"
      >
        ×
      </button>

    </div>


    <label>
      名前
    </label>

    <input
      id="itemName"
      class="field"
      type="text"
      maxlength="50"
      placeholder="例：綾波レイ"
    >


    <label>
      メモ
    </label>

    <textarea
      id="itemMemo"
      class="field"
      maxlength="500"
      placeholder="好きなところ、気になったことなど"
    ></textarea>


    <label>
      タグ
    </label>

    <input
      id="itemTags"
      class="field"
      type="text"
      maxlength="100"
      placeholder="例：推し 女性キャラ エヴァ"
    >

    <div class="muted">
      スペース区切りで複数登録できます
    </div>


    <button
      class="save-button"
      onclick="saveItem()"
    >
      保存
    </button>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
